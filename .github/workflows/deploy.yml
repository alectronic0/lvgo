name: Deploy and Minify Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_SERVER }}
      FTP_USER: ${{ secrets.HOSTINGER_USERNAME }}
      FTP_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prerender HTML
        run: |
          npm install puppeteer
          node scripts/prerender.js

      - name: Install Minifiers
        run: npm install -g terser clean-css-cli

      - name: Minify JS and CSS
        run: |
          find . -type f -name "*.js" ! -name "*.min.js" ! -path "*/node_modules/*" -exec sh -c 'terser "$1" -c -m -o "$1"' _ {} \;
          find . -type f -name "*.css" ! -name "*.min.css" ! -path "*/node_modules/*" -exec sh -c 'cleancss -o "$1" "$1"' _ {} \;

      - name: Update Sitemap Date
        run: |
          if [ -f "sitemap.xml" ]; then
            TODAY=$(date -u +%Y-%m-%d)
            sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|g" sitemap.xml
          fi

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          staticDistDir: ./
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Clean build artifacts for deployment
        run: |
          rm -rf node_modules package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Hostinger via native lftp (FTPS)
        if: env.FTP_SERVER != '' && env.FTP_USER != '' && env.FTP_PASS != ''
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            mirror --reverse --delete --verbose \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob package*.json \
              --exclude-glob eslint.config.js \
              --exclude-glob .prettierrc.json \
              --exclude-glob .stylelintrc.json \
              --exclude-glob scripts/ \
              --exclude-glob .idea/ \
              ./ ./public_html/;
            quit
          "
